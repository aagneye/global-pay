# Local development services. Credentials here are for local use only.
name: globalpay

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: globalpay
      POSTGRES_PASSWORD: globalpay
      POSTGRES_DB: globalpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalpay -d globalpay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
